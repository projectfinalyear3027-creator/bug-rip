# =============================================================================
# BUG SNIPER: Production Nginx Reverse Proxy Configuration
# Enforces HTTPS, redirects HTTP (80 -> 443), supports SSE & WebSockets,
# disables proxy buffering for real-time events, and hides internal ports.
# =============================================================================

# Map for WebSocket connection upgrading
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. HTTP Listener: Permanent Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bugsniper.example.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Listener: Reverse Proxy to Node.js on 127.0.0.1:3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bugsniper.example.com;

    # TLS Certificates (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/bugsniper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bugsniper.example.com/privkey.pem;

    # Hardened TLS Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum client upload (CSV imports, large payloads)
    client_max_body_size 10M;

    # Root proxy to Node.js application (localhost:3000 only)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Standard Forwarding Headers (consumed by Express trust proxy)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # CRITICAL FOR SSE & REALTIME STREAMS:
        # Disable buffering so timer, leaderboard, and stdout events arrive in real time
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Long read timeouts for persistent SSE / heartbeat connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
