version: '3.8'

services:
  # 1. Main Web API and Frontend Application
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: bugrip-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-bugrip_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bugrip_db}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bugrip-network

  # 2. BullMQ Execution Worker Service
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: bugrip-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bugrip-network

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bugrip-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bugrip_db}
      - POSTGRES_USER=${POSTGRES_USER:-bugrip_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bugrip_user} -d $${POSTGRES_DB:-bugrip_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bugrip-network

  # 4. Redis Queue & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: bugrip-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bugrip-network

volumes:
  postgres_data:
  redis_data:

networks:
  bugrip-network:
    driver: bridge
